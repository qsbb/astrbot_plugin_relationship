name: astrbot_plugin_relationship
display_name: 凝心溯溪-情
short_desc: 凝心溯溪系列关系模块：按关系人格管理短期态度与长期关系，支持跨平台自然人连续性
desc: >
  凝心溯溪系列关系模块：统一管理 bot 对用户及会话的短期情绪、长期好感、信任与熟悉度。
  核心数值由可信事件规则驱动，按关系人格、自然人、会话疲劳、用户压力与短期态度分离作用域；
  对外提供结构化状态快照和版本化事件契约，支持把多个平台账号登记为同一自然人，并在
  on_llm_request 阶段注入关系相关的语气、篇幅与主动性约束。通用对话收尾由“言”负责；
  本插件不接管发送、不改写模型回复、不介入权限或跨插件执行。
version: 0.6.8
author: Justice-ocr
author_desc: >
  AstrBot 插件开发者，关注对话自然度、长期关系建模与安全可控的人机交互。
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
repo: "https://github.com/qsbb/astrbot_plugin_relationship"
homepage: "https://github.com/qsbb/astrbot_plugin_relationship"
tags:
  - relationship
  - mood
  - affinity
  - trust
  - familiarity
  - state-management
license: "MIT"
disclaimer: >
  本插件只通过规则管理关系状态并提供表达建议。任何状态均不得用于辱骂、羞辱、威胁、报复或故意误导；
  命令与紧急求助消息始终受保护。
