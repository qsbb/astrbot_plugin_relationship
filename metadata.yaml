name: astrbot_plugin_relationship
display_name: 凝心溯溪-情
short_desc: 凝心溯溪系列关系模块：统一管理情绪、好感、信任与熟悉度，并按关系状态约束回复表达方式
desc: >
  凝心溯溪系列关系模块：统一管理 bot 对用户及会话的短期情绪、长期好感、信任与熟悉度。
  核心数值由规则驱动，按用户长期关系、会话疲劳和用户压力分离作用域；对外提供结构化状态快照
  与行为建议，并在 on_llm_request 阶段注入表达约束（语气、篇幅、主动性，以及“还需要我帮你…吗”
  这类服务式追问收尾的抑制）。仅调整表达方式，不接管发送、不改写模型回复、不介入权限或跨插件执行。
version: 0.4.1
author: Justice-ocr
author_desc: >
  AstrBot 插件开发者，关注对话自然度、长期关系建模与安全可控的人机交互。
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
repo: "https://github.com/qsbb/astrbot_plugin_relationship"
homepage: "https://github.com/qsbb/astrbot_plugin_relationship"
tags:
  - relationship
  - mood
  - affinity
  - trust
  - familiarity
  - state-management
license: "MIT"
disclaimer: >
  本插件只通过规则管理关系状态并提供表达建议。任何状态均不得用于辱骂、羞辱、威胁、报复或故意误导；
  命令与紧急求助消息始终受保护。
